<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Custom TV Reel</title>
<style>
@font-face{font-family:Plex;src:url(fonts/plex-ar-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:Plex;src:url(fonts/plex-ar-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:PlexLatin;src:url(fonts/plex-latin-700.woff2) format("woff2");font-weight:700}
#text span.latin{font-family:PlexLatin,sans-serif;direction:ltr;letter-spacing:-.01em}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Plex,sans-serif;font-weight:700}
.layer{position:absolute;inset:0}
.abs{position:absolute}
#frame{position:absolute;inset:36px;border-radius:56px;border:5px solid rgba(255,255,255,.07);pointer-events:none}
#text{position:absolute;left:80px;width:860px;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 26px;direction:rtl;text-align:center;line-height:1.18}
#text span{display:inline-block;will-change:transform}
.pill{position:absolute;padding:10px 26px;border-radius:999px;font-size:30px;font-weight:400;white-space:nowrap}
.tile{position:absolute;border-radius:18px}
.screen{position:absolute;overflow:hidden;border-radius:22px}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="glow" class="layer"></div>
  <div id="frame"></div>
  <div id="scene" class="layer"></div>
  <div id="room" class="layer"></div>
  <div id="text"></div>
  <div id="tags" class="layer"></div>
</div>
<script>
const TL = window.TL; const Wd = TL.words;
// original-recording time -> tightened-edit time (pauses cut); times inside a removed pause snap to the cut
const M = t => { for (const [a, b, s] of TL.map) { if (t < a) return s; if (t <= b) return s + t - a; } const [a, b, s] = TL.map.at(-1); return s + b - a + t - b; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
const ei = k => Math.pow(clamp(k), 3);
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const ramp = (t, a, d = .35) => eio((t - a) / d);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(',')})`; };
const $ = id => document.getElementById(id);
const END = TL.end;

// ---------- sections: background / text / accent ----------
const SECT = [
  { t: 0,     bg: '#12101F', fg: '#FFFFFF', ac: '#FFC93C' },
  { t: 16.1,  bg: '#2F2BFF', fg: '#FFFFFF', ac: '#FFE45C' },
  { t: 27.9,  bg: '#0B0B10', fg: '#FFFFFF', ac: '#FFC93C' },
  { t: 41.0,  bg: '#F4EFE6', fg: '#15131F', ac: '#E2483D' },
  { t: 56.8,  bg: '#FFC93C', fg: '#15131F', ac: '#2F2BFF' },
  { t: 63.1,  bg: '#12101F', fg: '#FFFFFF', ac: '#FFC93C' },
];
SECT.forEach(x => x.t = M(x.t));
function palette(t) {
  let i = 0; while (i + 1 < SECT.length && t >= SECT[i + 1].t) i++;
  const cur = SECT[i], prev = SECT[Math.max(0, i - 1)], k = i ? eio((t - cur.t) / .3) : 1;
  return { bg: mix(prev.bg, cur.bg, k), fg: mix(prev.fg, cur.fg, k), ac: mix(prev.ac, cur.ac, k), dark: cur.fg !== '#FFFFFF' };
}

// ---------- text cards (word index ranges, highlighted indices) ----------
const C = (a, b, hi = [], o = {}) => ({ a, b, hi, ...o });
const CARDS = [
  C(0, 2, [0], { y: 430 }), C(3, 5, [4], { y: 430 }), C(6, 8, [8]),
  C(9, 12, [12], { y: 520 }), C(13, 16, [16], { y: 520 }), C(17, 19, [18, 19], { y: 520 }), C(20, 22, [22], { y: 520 }),
  C(23, 26, [23]), C(27, 31, [30, 31], { y: 520 }), C(32, 34, [33], { y: 520, latin: { 33: 'Claude Code' }, drop: [34] }), C(35, 37, [37], { y: 520 }), C(38, 40, [39], { y: 520 }),
  C(41, 42, [42]),
  C(43, 46, [45], { y: 500 }), C(47, 51, [49, 50], { y: 500 }), C(52, 55, [55], { y: 500 }), C(56, 60, [], { y: 500 }),
  C(61, 65, [64]), C(66, 70, [67]), C(71, 74, [72, 73]), C(75, 79, [77]), C(80, 83, [82]), C(84, 87, [85]),
  C(88, 90, [89], { y: 520 }), C(91, 93, [92], { y: 520 }), C(94, 96, [95], { y: 520 }), C(97, 98, [97, 98], { y: 520 }),
  C(99, 102, [101]), C(103, 105, [105]),
  C(106, 109, [108], { y: 520 }), C(110, 113, [112], { y: 520 }), C(114, 117, [117], { y: 520 }),
  { custom: ['اكتب', '«تلفزيون»', 'بالتعليقات'], hi: [1], s: M(71.45), y: 520 },
];
CARDS.forEach((c, i) => {
  c.s = c.custom ? c.s : Wd[c.a].s - .06;
  c.words = c.custom ? c.custom.map((w, j) => ({ w, s: c.s + j * .09 })) : Wd.slice(c.a, c.b + 1).map((w, j) => ({ w: c.latin?.[c.a + j] ?? w.w, s: w.s - .06, idx: c.a + j, latin: !!c.latin?.[c.a + j] }))
    .filter(w => !(c.drop || []).includes(w.idx));
});
CARDS.forEach((c, i) => c.e = i + 1 < CARDS.length ? CARDS[i + 1].s : END + 1);
let shown = -1;
function renderText(t, P) {
  const el = $('text');
  const i = CARDS.findIndex(c => t >= c.s && t < c.e);
  if (i !== shown) {
    shown = i; el.innerHTML = '';
    if (i >= 0) CARDS[i].words.forEach((w, j) => {
      const s = document.createElement('span'); s.textContent = w.w; if (w.latin) s.className = 'latin';
      s.dataset.hi = CARDS[i].custom ? +CARDS[i].hi.includes(j) : +CARDS[i].hi.includes(w.idx);
      el.appendChild(s);
    });
  }
  if (i < 0) return;
  const c = CARDS[i], n = c.words.length, base = n <= 3 ? 128 : n <= 4 ? 116 : 104;
  const out = clamp((t - (c.e - .12)) / .12);
  [...el.children].forEach((s, j) => {
    const k = eo((t - c.words[j].s) / .22), hi = s.dataset.hi === '1';
    s.style.fontSize = (c.words[j].latin ? 128 : hi ? base * 1.28 : base) + 'px';
    s.style.color = hi ? P.ac : P.fg;
    s.style.opacity = k * (1 - out);
    s.style.transform = `translateY(${(1 - k) * 46 - out * 20}px) scale(${lerp(hi ? 1.25 : 1.12, 1, k) * (1 - out * .04)})`;
  });
  el.style.top = '0px';
  el.style.top = (c.y || 760) - el.offsetHeight / 2 + 'px';
}

// ---------- helpers ----------
function box(parent, css, cls = 'abs') { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); parent.appendChild(d); return d; }
function tag(text, x, y, dark, k) {
  const p = box($('tags'), { left: x + 'px', top: y + 'px', transform: 'translateX(-50%)', opacity: k,
    background: dark ? 'rgba(21,19,31,.08)' : 'rgba(255,255,255,.12)', color: dark ? '#15131F' : '#fff',
    border: `2px solid ${dark ? 'rgba(21,19,31,.25)' : 'rgba(255,255,255,.3)'}` }, 'pill');
  p.textContent = text; return p;
}
const ILLU = 'تصوّر توضيحي · حسب دعم الجهاز';

// generic TV home UI (no real brands): hero band + tile row
function genericUI(s, w, h, t) {
  box(s, { inset: 0, background: 'linear-gradient(160deg,#1E1B3A,#0D0C18)' });
  box(s, { left: w * .05 + 'px', top: h * .1 + 'px', width: w * .9 + 'px', height: h * .45 + 'px', borderRadius: '16px',
    background: 'linear-gradient(120deg,#5B5BFF,#FF7A59)' });
  box(s, { right: w * .09 + 'px', top: h * .2 + 'px', width: w * .32 + 'px', height: h * .05 + 'px', borderRadius: '8px', background: 'rgba(255,255,255,.85)' });
  box(s, { right: w * .09 + 'px', top: h * .29 + 'px', width: w * .22 + 'px', height: h * .035 + 'px', borderRadius: '8px', background: 'rgba(255,255,255,.5)' });
  const cols = ['#FFC93C', '#3CF0FF', '#FF7A59', '#9B8CFF', '#7CE38B'];
  for (let i = 0; i < 5; i++) box(s, { left: w * (.05 + i * .184) + 'px', top: h * .62 + 'px', width: w * .164 + 'px', height: h * .28 + 'px',
    borderRadius: '12px', background: cols[i], opacity: .9, transform: i === 2 ? 'scale(1.08)' : 'none', boxShadow: i === 2 ? '0 0 0 4px #fff' : 'none' });
}

// ---------- scene: opening graphic TV (stand-in for footage A1–A3) ----------
function opening(t) {
  const room = $('room'); room.innerHTML = '';
  if (t >= 3.32) return;
  const push = ei((t - 2.8) / .5), fade = clamp((t - 3.08) / .24);
  room.style.opacity = 1 - fade;
  const cx = 540, cy = 1060, w = 940, h = 529;
  const r = box(room, { inset: 0, background: 'radial-gradient(120% 70% at 50% 55%,#24203A 0%,#0A0910 70%)' });
  box(r, { left: 0, right: 0, top: '1420px', bottom: 0, background: 'linear-gradient(#17141F,#0B0A10)' });
  const zoom = lerp(1, 3.8, push), drift = lerp(1, 1.04, clamp(t / 2.8));
  r.style.transformOrigin = `${cx}px ${cy}px`; r.style.transform = `scale(${zoom * drift})`;
  box(r, { left: cx - 70 + 'px', top: cy + h / 2 + 10 + 'px', width: '140px', height: '150px', background: '#07070A', clipPath: 'polygon(35% 0,65% 0,100% 100%,0 100%)' });
  const tv = box(r, { left: cx - w / 2 - 16 + 'px', top: cy - h / 2 - 16 + 'px', width: w + 32 + 'px', height: h + 32 + 'px', background: '#050507', borderRadius: '24px',
    boxShadow: t > 1.0 ? `0 0 ${120 * eo((t - 1) / .4)}px rgba(120,110,255,.45)` : 'none' });
  const s = box(tv, { left: '16px', top: '16px', width: w + 'px', height: h + 'px' }, 'screen');
  const on = clamp((t - 1.0) / .5);
  box(s, { inset: 0, background: 'linear-gradient(135deg,#101016,#050507)' });
  if (on > 0) {
    const ui = box(s, { inset: 0, clipPath: `circle(${eo(on) * 75}% at 50% 50%)` }); genericUI(ui, w, h, t);
    box(s, { inset: 0, background: '#fff', opacity: clamp(1 - (t - 1.0) / .12) });
  }
  box(s, { inset: 0, background: 'linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%)' });
  if (on > 0 && push < .2) tag(ILLU, 540, 1370, false, eo((t - 1.2) / .3) * (1 - push * 5));
}

// ---------- scene: customization demo (7.1–14.9) ----------
function customize(t, P) {
  const S = $('scene'), w = 860, h = 484, x0 = 110, y0 = 1180 - h / 2;
  const k = eo((t - M(7.1)) / .45) * (1 - clamp((t - M(15.0)) / .3));
  if (k <= 0) return;
  const wrap = box(S, { left: x0 + 'px', top: y0 + 'px', width: w + 'px', height: h + 'px', opacity: k,
    transform: `translateY(${(1 - k) * 90}px) perspective(1600px) rotateX(${(1 - k) * 18 + 6}deg)` });
  const s = box(wrap, { inset: 0, border: '12px solid #050507' }, 'screen');
  const kBg = ramp(t, M(7.94)), kMenu = ramp(t, M(10.12)), kArr = ramp(t, M(10.9), .6), kCol = ramp(t, M(12.42)), kLay = ramp(t, M(14.36), .4);
  box(s, { inset: 0, background: '#2A2840' });
  box(s, { inset: 0, background: 'linear-gradient(140deg,#FF7A59,#7B2FF7)', opacity: kBg });
  const iw = w - 24, ih = h - 24;
  // menu: top bar → side rail
  for (let i = 0; i < 4; i++) {
    const top = { x: iw - 40 - (i + 1) * 96, y: 18, w: 84, h: 30 }, side = { x: iw - 74, y: 30 + i * 58, w: 56, h: 40 };
    box(s, { left: lerp(top.x, side.x, kMenu) + 'px', top: lerp(top.y, side.y, kMenu) + 'px', width: lerp(top.w, side.w, kMenu) + 'px',
      height: lerp(top.h, side.h, kMenu) + 'px', borderRadius: '10px', background: i === 0 ? '#fff' : 'rgba(255,255,255,.45)' });
  }
  const area = { x: 24, y: lerp(66, 24, kMenu), w: lerp(iw - 48, iw - 120, kMenu), h: lerp(ih - 90, ih - 48, kMenu) };
  const gap = 16, tw = (area.w - 2 * gap) / 3, th = (area.h - gap) / 2;
  const grid = j => ({ x: area.x + (2 - j % 3) * (tw + gap), y: area.y + Math.floor(j / 3) * (th + gap), w: tw, h: th });
  const ORDER = [4, 0, 5, 2, 1, 3];
  const sw = (area.w - 4 * gap) / 5;
  const layout = i => i === 0 ? { x: area.x, y: area.y, w: area.w, h: area.h * .58 }
    : { x: area.x + (5 - i) * (sw + gap), y: area.y + area.h * .58 + gap, w: sw, h: area.h * .42 - gap };
  const A = ['#55536E', '#6B6987', '#4A4862', '#5F5D7A', '#706E8C', '#57556F'];
  const B = ['#FFC93C', '#3CF0FF', '#FFFFFF', '#7CE38B', '#FF5FA2', '#9B8CFF'];
  for (let i = 0; i < 6; i++) {
    const g0 = grid(i), g1 = grid(ORDER[i]), L = layout(i);
    const g = { x: lerp(g0.x, g1.x, kArr), y: lerp(g0.y, g1.y, kArr), w: g0.w, h: g0.h };
    const r = { x: lerp(g.x, L.x, kLay), y: lerp(g.y, L.y, kLay), w: lerp(g.w, L.w, kLay), h: lerp(g.h, L.h, kLay) };
    box(s, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', background: mix(A[i], B[i], kCol) }, 'tile');
  }
  tag(ILLU, 540, y0 + h + 40, false, k);
}

// ---------- scene: abstract code panel for the AI part (17.6–27) ----------
function codePanel(t) {
  const k = eo((t - M(17.6)) / .45) * (1 - clamp((t - M(27.0)) / .3));
  if (k <= 0) return;
  const w = 860, h = 470, y0 = 1180 - h / 2;
  const p = box($('scene'), { left: '110px', top: y0 + 'px', width: w + 'px', height: h + 'px', background: '#0E0D1A', borderRadius: '28px', opacity: k,
    transform: `translateY(${(1 - k) * 80}px)`, direction: 'ltr',
    boxShadow: `0 30px 80px rgba(0,0,0,.35), 0 0 0 ${3 + 10 * Math.max(0, 1 - Math.abs(t - M(21.4)) / .5)}px rgba(255,228,92,.55)` });
  ['#FF7A59', '#FFC93C', '#7CE38B'].forEach((c, i) => box(p, { left: 28 + i * 34 + 'px', top: '26px', width: '18px', height: '18px', borderRadius: '50%', background: c }));
  const L = [[0, .42, '#9B8CFF'], [1, .64, '#3CF0FF'], [1, .38, '#FFFFFF'], [2, .55, '#FFC93C'], [2, .3, '#7CE38B'], [1, .7, '#FF7A59'],
             [2, .46, '#3CF0FF'], [1, .34, '#9B8CFF'], [0, .5, '#FFFFFF']];
  L.forEach(([ind, len, c], i) => {
    const s = lerp(M(18.6), M(26.6), i / (L.length - 1)), g = eo((t - s) / .3);
    box(p, { left: 40 + ind * 44 + 'px', top: 80 + i * 40 + 'px', width: (w - 120) * len * g + 'px', height: '18px', borderRadius: '9px', background: c, opacity: .85 });
  });
}

// ---------- scene: three illustrative interface examples (30–40) ----------
function examples(t) {
  const k = eo((t - M(30.1)) / .45) * (1 - clamp((t - M(40.0)) / .35));
  if (k <= 0) return;
  const w = 900, h = 506, y0 = 1110 - h / 2;
  const kind = t < M(32.1) ? 0 : t < M(35.9) ? 1 : 2, since = [M(30.1), M(32.1), M(35.9)][kind];
  const sw = eo((t - since) / .4);
  const wrap = box($('scene'), { left: '90px', top: y0 + 'px', width: w + 'px', height: h + 'px', opacity: k,
    transform: `perspective(1800px) rotateX(6deg) translateY(${(1 - k) * 90}px) rotateY(${kind ? (1 - sw) * -22 : 0}deg)` });
  const s = box(wrap, { inset: 0, border: '12px solid #050507' }, 'screen');
  const iw = w - 24, ih = h - 24;
  if (kind === 0) { // cinematic
    box(s, { inset: 0, background: '#050505' });
    box(s, { left: 0, top: 0, width: iw + 'px', height: ih * .58 + 'px', background: 'radial-gradient(90% 120% at 70% 30%,#E8A33D 0%,#7A1E1E 45%,#050505 85%)' });
    box(s, { left: 0, top: 0, width: iw + 'px', height: '26px', background: '#000' });
    box(s, { right: '40px', top: ih * .24 + 'px', width: '300px', height: '26px', borderRadius: '6px', background: '#F5E6C8' });
    box(s, { right: '40px', top: ih * .24 + 40 + 'px', width: '190px', height: '16px', borderRadius: '6px', background: 'rgba(245,230,200,.6)' });
    const f = Math.floor(clamp((t - M(30.6)) / 1.5) * 5.99);
    for (let i = 0; i < 6; i++) {
      const pw = 118, x = iw - 30 - (i + 1) * (pw + 18) + 18;
      box(s, { left: x + 'px', top: ih * .62 + 'px', width: pw + 'px', height: ih * .34 + 'px', borderRadius: '8px',
        background: `linear-gradient(170deg,${['#3A2A1A', '#2A1A2E', '#1A2A33', '#33261A', '#1E1E28', '#2E1A1A'][i]},#0A0A0A)`,
        boxShadow: i === f ? '0 0 0 4px #E8A33D' : 'none', transform: i === f ? 'scale(1.06)' : 'none' });
    }
  } else if (kind === 1) { // family & kids
    box(s, { inset: 0, background: '#FFF4E0' });
    ['#FF8FA3', '#7FC8F8', '#FFD166', '#95D5B2'].forEach((c, i) => box(s, { right: 36 + i * 92 + 'px', top: '28px', width: '68px', height: '68px', borderRadius: '50%', background: c, border: '5px solid #fff' }));
    const P = ['#FFB4A2', '#B5E48C', '#A0C4FF', '#FFD6A5', '#CDB4DB', '#9BF6FF'];
    const SH = ['circle(32% at 50% 50%)', 'polygon(50% 12%,88% 84%,12% 84%)', 'inset(22% 22% 22% 22% round 16px)',
                'polygon(50% 8%,61% 38%,94% 38%,67% 58%,78% 90%,50% 70%,22% 90%,33% 58%,6% 38%,39% 38%)', 'circle(32% at 50% 50%)', 'inset(28% 14% 28% 14% round 40px)'];
    const f = Math.floor(clamp((t - M(32.6)) / 2.4) * 5.99);
    for (let i = 0; i < 6; i++) {
      const tw = (iw - 72 - 40) / 3, th = (ih - 130 - 56) / 2, x = iw - 36 - (i % 3 + 1) * tw - (i % 3) * 20, y = 120 + Math.floor(i / 3) * (th + 20);
      const tile = box(s, { left: x + 'px', top: y + 'px', width: tw + 'px', height: th + 'px', borderRadius: '30px', background: P[i],
        transform: i === f ? 'scale(1.07)' : 'none', boxShadow: i === f ? '0 0 0 6px #fff,0 0 0 10px #FF8FA3' : 'none' });
      box(tile, { inset: 0, background: 'rgba(255,255,255,.75)', clipPath: SH[i] });
    }
  } else { // futuristic / minimal
    box(s, { inset: 0, background: 'radial-gradient(80% 90% at 50% 40%,#0C1530 0%,#04060D 75%)' });
    for (let i = 0; i < 9; i++) box(s, { left: 0, right: 0, top: ih * .62 + Math.pow(i / 8, 1.8) * ih * .38 + 'px', height: '2px', background: 'rgba(60,240,255,.35)' });
    for (let i = -6; i <= 6; i++) box(s, { left: iw / 2 + 'px', top: ih * .62 + 'px', width: '2px', height: ih * .5 + 'px', background: 'rgba(60,240,255,.25)',
      transformOrigin: 'top', transform: `rotate(${i * 11}deg)` });
    const R = 150, rot = (t - M(35.9)) * 40;
    box(s, { left: iw / 2 - R + 'px', top: ih * .38 - R + 'px', width: R * 2 + 'px', height: R * 2 + 'px', borderRadius: '50%',
      border: '3px solid #3CF0FF', borderTopColor: 'transparent', transform: `rotate(${rot}deg)`, boxShadow: '0 0 30px rgba(60,240,255,.5)' });
    box(s, { left: iw / 2 - 90 + 'px', top: ih * .38 - 12 + 'px', width: '180px', height: '24px', borderRadius: '12px', background: 'rgba(255,255,255,.9)' });
    [-1, 1].forEach((d, i) => box(s, { left: iw / 2 + d * 300 - 80 + 'px', top: ih * .3 + Math.sin(t * 2 + i) * 10 + 'px', width: '160px', height: '110px', borderRadius: '18px',
      background: 'rgba(120,200,255,.10)', border: '2px solid rgba(60,240,255,.55)' }));
  }
  tag(ILLU, 540, y0 + h + 46, false, k);
}

// ---------- scene: "three examples" chips (28–30) ----------
function chips(t) {
  const k = eo((t - M(28.4)) / .35) * (1 - clamp((t - M(30.1)) / .2));
  if (k <= 0) return;
  ['#E8A33D', '#FF8FA3', '#3CF0FF'].forEach((c, i) => {
    const ki = eo((t - M(28.4) - i * .12) / .3);
    box($('scene'), { left: 540 - 330 + i * 230 + 'px', top: 1080 + (1 - ki) * 60 + 'px', width: '200px', height: '200px', borderRadius: '36px',
      background: c, opacity: ki * k, transform: `rotate(${(i - 1) * 6}deg)` });
  });
}
